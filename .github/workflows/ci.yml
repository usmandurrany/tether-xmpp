name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: OpenSSL headers for the Linux native transport
        run: sudo apt-get update -q && sudo apt-get install -y -q libssl-dev
      - name: Build and test (JVM and Linux native)
        run: ./gradlew check --stacktrace
